---
- name: Check and remediate Datadog Agent service
  hosts: all
  become: true
  gather_facts: false

  vars:
    service_name: datadog-agent.service

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
      register: datadog_service_facts
      ignore_unreachable: true

    - name: End compliance check for unreachable host
      ansible.builtin.meta: end_host
      when: datadog_service_facts is ansible.builtin.unreachable

    - name: Fail if Datadog Agent service is missing
      ansible.builtin.fail:
        msg: "Datadog Agent service is missing"
      when: service_name not in ansible_facts.services

    - name: Start and enable Datadog Agent when it is stopped
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        state: started
        enabled: true
      when:
        - service_name in ansible_facts.services
        - ansible_facts.services[service_name].state != "running"

    - name: Refresh service facts after remediation
      ansible.builtin.service_facts:
      register: datadog_remediation_facts
      ignore_unreachable: true

    - name: End compliance check if host became unreachable
      ansible.builtin.meta: end_host
      when: datadog_remediation_facts is ansible.builtin.unreachable

    - name: Fail if Datadog Agent is still not running
      ansible.builtin.fail:
        msg: "Datadog Agent service exists but could not be started"
      when:
        - service_name in ansible_facts.services
        - ansible_facts.services[service_name].state != "running"